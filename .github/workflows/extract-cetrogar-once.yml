name: First real Cetrogar price extraction

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/extract-cetrogar-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-cetrogar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Register a verified public Cetrogar product page
        run: |
          curl --fail --silent --show-error --max-time 25 \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{"store_id":8,"product_url":"https://www.cetrogar.com.ar/tv-led-55-samsung-neo-qled-55qn70f-tv3326/p?idsku=2379","product_name":"Smart TV Samsung 55QN70F 55 pulgadas Neo QLED","currency":"ARS"}' \
            "https://pricescope-api.onrender.com/api/v1/store-products"
      - name: Extract the live Cetrogar product price
        run: |
          curl --fail --silent --show-error --max-time 90 \
            --request POST \
            "https://pricescope-api.onrender.com/api/v1/management/stores/8/extract"
