name: Daily real market ingestion

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest-real-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRICESCOPE_ADMIN_API_TOKEN: ${{ secrets.PRICESCOPE_ADMIN_API_TOKEN }}
    steps:
      - name: Require the protected backend credential
        run: |
          if [ -z "$PRICESCOPE_ADMIN_API_TOKEN" ]; then
            echo "::error::Configure repository secret PRICESCOPE_ADMIN_API_TOKEN with the same value as Render ADMIN_API_TOKEN."
            exit 1
          fi
      - name: Run authorized daily extraction and quote collection
        run: |
          curl --fail --silent --show-error --max-time 900 \
            --request POST \
            --header "X-Admin-API-Token: $PRICESCOPE_ADMIN_API_TOKEN" \
            "https://pricescope-api.onrender.com/api/v1/management/ingestion/daily"
      - name: Extract configured public retailer listings
        run: |
          failed=0
          for store_id in 1 8 11; do
            listings=$(curl --fail --silent --show-error --max-time 45 \
              "https://pricescope-api.onrender.com/api/v1/management/stores/$store_id/store-products")
            listing_count=$(printf '%s' "$listings" | jq 'length')
            if [ "$listing_count" -eq 0 ]; then
              echo "Skipping store_id=$store_id: no product listing is configured."
              continue
            fi
            echo "Extracting store_id=$store_id from $listing_count configured product listing(s)."
            if ! curl --fail --silent --show-error --max-time 120 \
              --request POST \
              --header "X-Admin-API-Token: $PRICESCOPE_ADMIN_API_TOKEN" \
              "https://pricescope-api.onrender.com/api/v1/management/stores/$store_id/extract"; then
              echo "::error::Extraction failed for store_id=$store_id; continuing."
              failed=1
            fi
          done
          exit "$failed"
