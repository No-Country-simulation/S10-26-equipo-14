name: First real Coto price extraction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-coto:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PRICESCOPE_ADMIN_API_TOKEN: ${{ secrets.PRICESCOPE_ADMIN_API_TOKEN }}
    steps:
      - name: Require the protected backend credential
        run: |
          test -n "$PRICESCOPE_ADMIN_API_TOKEN" || { echo "::error::Configure PRICESCOPE_ADMIN_API_TOKEN with the Render ADMIN_API_TOKEN value."; exit 1; }
      - name: Register a verified public Coto product page
        run: |
          curl --fail --silent --show-error --max-time 25 \
            --request POST \
            --header "X-Admin-API-Token: $PRICESCOPE_ADMIN_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"store_id":4,"product_url":"https://www.coto.com.ar/productos/leche-larga-vida-parcialmente-descremada-liviana-1-la-serenisima-1l-/_/R-00251876-00251876-200?t=20260908","product_name":"Leche Larga Vida Parcialmente Descremada Liviana 1% La Serenisima 1l","currency":"ARS"}' \
            "https://pricescope-api.onrender.com/api/v1/store-products"
      - name: Extract the live Coto product price
        run: |
          curl --fail --silent --show-error --max-time 90 \
            --request POST \
            --header "X-Admin-API-Token: $PRICESCOPE_ADMIN_API_TOKEN" \
            "https://pricescope-api.onrender.com/api/v1/management/stores/4/extract"
