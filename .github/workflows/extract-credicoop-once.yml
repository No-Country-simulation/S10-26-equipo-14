name: First real Tienda Credicoop price extraction

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/extract-credicoop-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-credicoop:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Register a verified public product page
        run: |
          curl --fail --silent --show-error --max-time 25 \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{"store_id":1,"product_url":"https://tiendacredicoop.coop/televisores-y-accesorios/43925-smart-tv-samsung-qled-4-k-uhd-55-qn-55-q-6-faag-7798180339319.html","product_name":"Smart TV Samsung QLED 4K UHD 55 QN55Q6FAAG","currency":"ARS"}' \
            "https://pricescope-api.onrender.com/api/v1/store-products"
      - name: Extract the live Tienda Credicoop product price
        run: |
          curl --fail --silent --show-error --max-time 90 \
            --request POST \
            "https://pricescope-api.onrender.com/api/v1/management/stores/1/extract"
