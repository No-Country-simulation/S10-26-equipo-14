name: Daily real price collection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-registered-products:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PRICESCOPE_ADMIN_API_TOKEN: ${{ secrets.PRICESCOPE_ADMIN_API_TOKEN }}
    steps:
      - name: Require the protected backend credential
        run: |
          if [ -z "$PRICESCOPE_ADMIN_API_TOKEN" ]; then
            echo "::error::Configure the repository secret PRICESCOPE_ADMIN_API_TOKEN with the same value as Render ADMIN_API_TOKEN."
            exit 1
          fi
      - name: Collect prices from each configured real store
        run: |
          failed=0
          for store_id in 1 8 11; do
            echo "Starting extraction for store_id=$store_id"
            if response=$(curl --fail --silent --show-error --max-time 120 \
              --request POST \
              --header "X-Admin-API-Token: $PRICESCOPE_ADMIN_API_TOKEN" \
              "https://pricescope-api.onrender.com/api/v1/management/stores/$store_id/extract"); then
              echo "$response"
            else
              echo "::error::Extraction failed for store_id=$store_id; continuing with remaining stores."
              failed=1
            fi
          done
          exit "$failed"
