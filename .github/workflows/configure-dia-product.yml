name: Configure and extract verified Dia Online product

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure-and-extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRICESCOPE_ADMIN_API_TOKEN: ${{ secrets.PRICESCOPE_ADMIN_API_TOKEN }}
      PRODUCT_URL: https://diaonline.supermercadosdia.com.ar/snack-tasty-bite-carne-pedigree-40-gr-314778/p
    steps:
      - name: Require the protected backend credential
        run: |
          if [ -z "$PRICESCOPE_ADMIN_API_TOKEN" ]; then
            echo "::error::Configure repository secret PRICESCOPE_ADMIN_API_TOKEN with the same value as Render ADMIN_API_TOKEN."
            exit 1
          fi
      - name: Configure the already registered Dia Online store
        run: |
          curl --fail --silent --show-error --max-time 45 \
            --request PUT \
            --header "X-Admin-API-Token: $PRICESCOPE_ADMIN_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"base_url":"https://diaonline.supermercadosdia.com.ar"}' \
            "https://pricescope-api.onrender.com/api/v1/management/stores/6/base-url"
      - name: Register the verified listing if it is not present
        run: |
          listings=$(curl --fail --silent --show-error --max-time 45 \
            "https://pricescope-api.onrender.com/api/v1/management/stores/6/store-products")
          if printf '%s' "$listings" | jq -e --arg url "$PRODUCT_URL" 'any(.[]; .product_url == $url)' >/dev/null; then
            echo "The verified product listing is already registered."
          else
            curl --fail --silent --show-error --max-time 45 \
              --request POST \
              --header "X-Admin-API-Token: $PRICESCOPE_ADMIN_API_TOKEN" \
              --header "Content-Type: application/json" \
              --data '{"product_url":"https://diaonline.supermercadosdia.com.ar/snack-tasty-bite-carne-pedigree-40-gr-314778/p","product_name":"Snack Tasty Bite Carne Pedigree 40 Gr.","external_id":"00314778","currency":"ARS"}' \
              "https://pricescope-api.onrender.com/api/v1/management/stores/6/store-products"
          fi
      - name: Extract and persist the current public price
        run: |
          curl --fail --silent --show-error --max-time 120 \
            --request POST \
            --header "X-Admin-API-Token: $PRICESCOPE_ADMIN_API_TOKEN" \
            "https://pricescope-api.onrender.com/api/v1/management/stores/6/extract"
