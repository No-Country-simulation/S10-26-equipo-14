name: Add second verified Credicoop product

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  add-product:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PRICESCOPE_ADMIN_API_TOKEN: ${{ secrets.PRICESCOPE_ADMIN_API_TOKEN }}
    steps:
      - name: Require the protected backend credential
        run: |
          test -n "$PRICESCOPE_ADMIN_API_TOKEN" || { echo "::error::Configure PRICESCOPE_ADMIN_API_TOKEN with the Render ADMIN_API_TOKEN value."; exit 1; }
      - name: Register the public product page
        run: |
          curl --fail --silent --show-error --max-time 25 \
            --request POST \
            --header "X-Admin-API-Token: $PRICESCOPE_ADMIN_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"store_id":1,"product_url":"https://tiendacredicoop.coop/televisores-y-accesorios/30911-smart-tv-samsung-85-qled-4-k-q-7-f-vision-ai.html","product_name":"Smart TV Samsung 85 QLED 4K Q7F Vision AI","currency":"ARS"}' \
            "https://pricescope-api.onrender.com/api/v1/store-products"
      - name: Extract the current product price
        run: |
          curl --fail --silent --show-error --max-time 90 \
            --request POST \
            --header "X-Admin-API-Token: $PRICESCOPE_ADMIN_API_TOKEN" \
            "https://pricescope-api.onrender.com/api/v1/management/stores/1/extract"
